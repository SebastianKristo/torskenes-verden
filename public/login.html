<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>OS · Lås opp</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/app.css">
<link rel="stylesheet" href="/assets/css/login.css">
<script type="module" src="/assets/js/login.js"></script>
</head>
<body>
<div class="lock">
  <form id="login" class="lock-box">
    <div class="logo">OS</div>
    <div class="lock-title">Hei, <b>velkommen hjem</b></div>
    <div class="step" data-step="cred">
      <input name="username" placeholder="Brukernavn" autocomplete="username" autocapitalize="off" autocorrect="off" spellcheck="false" autofocus aria-label="Brukernavn">
      <input type="password" name="password" placeholder="Passord" autocomplete="current-password" aria-label="Passord">
    </div>
    <div class="step" data-step="code" hidden>
      <div class="lock-hint">Tofaktor er på for <b id="tfa-user"></b>. Skriv inn den 6-sifrede koden fra autentiseringsappen.</div>
      <input name="code" class="code" inputmode="numeric" autocomplete="one-time-code" maxlength="11" placeholder="000000" aria-label="Kode fra autentiseringsappen">
      <div class="lock-small">Mistet telefonen? Skriv inn en gjenopprettingskode.</div>
    </div>
    <div class="err" id="err" role="alert" hidden></div>
    <label class="remember" data-step="cred"><input type="checkbox" name="remember" checked><span>Husk denne enheten på lokalt nett</span></label>
    <button type="submit" class="lock-btn">Lås opp</button>
    <button type="button" class="lock-back" id="back" data-step="code" hidden>← Tilbake</button>
  </form>
</div>
</body>
</html>
