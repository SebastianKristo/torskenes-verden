<!doctype html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3efe6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Logg inn · Homelab</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/css/login.css">
<script type="module" src="/assets/js/login.js"></script>
</head>
<body>
<!-- Innlogging og førstegangsoppsett i Papir-stil (prompt 25, «Homelab Papir Web» tweak gate):
     toppbilde til venstre, skjema på papir til høyre. Smale skjermer stabler dem. -->
<main class="gate" id="gate-root">
  <div class="gate-hero" id="g-hero">
    <span class="gate-brand" id="g-brand">Homelab</span>
    <div class="gate-hero-t"><span class="gate-kick" id="g-kick"></span><h1 id="g-title"></h1></div>
  </div>
  <div class="gate-side">
    <form id="gate" class="gate-form" novalidate>
      <div class="gate-bars" data-show="onb" hidden><span></span><span></span><span></span><span></span></div>
      <span class="gate-lab" id="g-lab">LOGG INN</span>
      <b class="gate-h" id="g-h">Logg inn på Homelab</b>
      <span class="gate-sub" id="g-sub">Bruk brukernavnet og passordet for serveren din.</span>

      <div class="gate-fields" data-show="login">
        <label class="gate-l" for="f-srv">Server</label>
        <input id="f-srv" name="srv" class="gate-in mono" autocomplete="url" autocapitalize="none" autocorrect="off" spellcheck="false" inputmode="url">
        <label class="gate-l" for="f-u">Brukernavn</label>
        <input id="f-u" name="username" class="gate-in" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
        <label class="gate-l" for="f-pw">Passord</label>
        <input id="f-pw" name="password" type="password" class="gate-in" autocomplete="current-password">
      </div>

      <div class="gate-fields" data-show="2fa" hidden>
        <label class="gate-l" for="f-code" id="f-code-l">Kode fra autentiseringsappen</label>
        <input id="f-code" name="code" class="gate-in gate-code" inputmode="numeric" autocomplete="one-time-code" placeholder="123 456">
        <button type="button" class="gate-link" id="g-recovery">Mistet telefonen? Bruk en gjenopprettingskode</button>
      </div>

      <div class="gate-fields" data-show="s1" hidden>
        <span class="gate-l" data-no-i18n>Språk / Language</span>
        <div class="gate-langs" id="g-langs" role="radiogroup" aria-label="Språk / Language"><button type="button" data-lang="nb" role="radio" data-no-i18n>Norsk</button><button type="button" data-lang="en" role="radio" data-no-i18n>English</button></div>
        <label class="gate-l" for="f-name">Navn på hovedadmin</label>
        <input id="f-name" name="adminName" class="gate-in" placeholder="Sebastian" autocomplete="name" maxlength="60">
        <label class="gate-l" for="f-server">Navn på serveren</label>
        <input id="f-server" name="serverName" class="gate-in" placeholder="Homelab" value="Homelab" maxlength="40">
      </div>

      <div class="gate-fields" data-show="s2" hidden>
        <label class="gate-l" for="f-ou">Brukernavn</label>
        <input id="f-ou" name="newUsername" class="gate-in" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" maxlength="32">
        <label class="gate-l" for="f-opw">Passord</label>
        <input id="f-opw" name="newPassword" type="password" class="gate-in" autocomplete="new-password">
        <label class="gate-l" for="f-opw2">Gjenta passord</label>
        <input id="f-opw2" name="newPassword2" type="password" class="gate-in" autocomplete="new-password">
      </div>

      <div class="gate-bgs" data-show="s3" hidden id="g-bgs"></div>

      <div class="gate-sum" data-show="s4" hidden id="g-sum"></div>

      <span class="gate-err" id="g-err" role="alert" hidden></span>
      <button type="submit" class="gate-btn" id="g-btn">Logg inn</button>
      <div class="gate-foot">
        <button type="button" class="gate-back" id="g-back" hidden>← Tilbake</button>
        <span class="gate-grow"></span>
        <span class="gate-foot-t" id="g-foot"></span>
      </div>
    </form>
  </div>
</main>
</body>
</html>
