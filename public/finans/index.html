<style>
/* Lasteskjerm for Økonomi (prompt 20): inline, så den står før JS og CSS er lastet. Vises bare når loader.js setter data-fhl. */
#fh-load{display:none}
html[data-fhl] #fh-load{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;background:#f3efe6;color:#1b1a17;font-family:'Manrope',system-ui,sans-serif;transition:opacity .25s ease}
html[data-fhl="dark"] #fh-load{background:#0e0f12;color:#ece8df}
html[data-fhl] body{background:#f3efe6}
html[data-fhl="dark"] body{background:#0e0f12}
#fh-load.out{opacity:0;pointer-events:none}
#fh-load .fhl-back{position:absolute;top:20px;left:clamp(16px,3vw,44px);display:inline-flex;align-items:center;height:38px;padding:0 16px 0 12px;box-sizing:border-box;border:1px solid #d8d1c2;border-radius:999px;background:#fff;color:#1b1a17;text-decoration:none;font:600 13.5px 'Manrope',system-ui,sans-serif}
html[data-fhl="dark"] #fh-load .fhl-back{border-color:#2a2925;background:#17181c;color:#ece8df}
#fh-load .fhl-back:hover{background:#f7f4ee}
html[data-fhl="dark"] #fh-load .fhl-back:hover{background:#1f2025}
#fh-load .fhl-mid{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;box-sizing:border-box;text-align:center}
#fh-load .fhl-kr{width:56px;height:56px;border-radius:16px;background:#b23a2a;color:#fff;display:grid;place-items:center;font:500 24px 'Newsreader',Georgia,serif}
html[data-fhl="dark"] #fh-load .fhl-kr{background:#c9493a}
#fh-load .fhl-t{font:500 44px/1 'Newsreader',Georgia,'Times New Roman',serif;letter-spacing:-.01em}
#fh-load .fhl-bar{position:relative;width:220px;max-width:70vw;height:3px;border-radius:2px;background:#e3dccd;overflow:hidden}
html[data-fhl="dark"] #fh-load .fhl-bar{background:#26251f}
#fh-load .fhl-bar i{position:absolute;top:0;bottom:0;left:0;width:40%;border-radius:2px;background:#b23a2a;animation:fhl-slide 1.1s cubic-bezier(.4,0,.2,1) infinite}
html[data-fhl="dark"] #fh-load .fhl-bar i{background:#e0604f}
#fh-load .fhl-sub{font:600 10.5px 'IBM Plex Mono',ui-monospace,monospace;letter-spacing:.12em;color:#8f897c}
html[data-fhl="dark"] #fh-load .fhl-sub{color:#8a8478}
@keyframes fhl-slide{0%{transform:translateX(-100%)}100%{transform:translateX(250%)}}
@media (prefers-reduced-motion:reduce){#fh-load .fhl-bar i{animation-duration:3s}}
</style>
<link rel="stylesheet" href="/assets/finans/css/finans.css">

</head>
<body>
<div id="fh-load" role="status" aria-label="Laster Økonomi"><a class="fhl-back" href="/">‹ Hjem</a><div class="fhl-mid"><span class="fhl-kr" aria-hidden="true">kr</span><div class="fhl-t">Økonomi</div><div class="fhl-bar" aria-hidden="true"><i></i></div><div class="fhl-sub">HENTER KONTOER, BUDSJETT OG KVITTERINGER</div></div></div>
<div id="app" aria-live="polite"><div data-boot style="padding:40px;color:#8C8C96;font-family:system-ui">Laster FinansHub …</div></div>
</body>
