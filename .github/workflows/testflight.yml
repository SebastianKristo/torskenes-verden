# Laster opp appene til TestFlight: Homelab (FinansHub, no.kristo.finanshub, med FinansHubWidgets), Kalender for iPhone
# (no.kristo.kalender, med KalenderWidgets) og Kalender for Mac (no.kristo.kalender.mac, med KalenderMacWidgets). Oppsettet i Apple Developer og App Store Connect: docs/testflight.md.
#
# Start: Actions → TestFlight → Run workflow (velg alle, homelab, kalender eller kalender-mac), eller push en tag v* (samme tag som
# release.yml bruker; de to workflowene kjører hver for seg og deler ingenting).
#
# Hemmeligheter (uten dem hopper workflowen over med «Mangler TestFlight-hemmeligheter», og kjøringen er grønn):
#   ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8_BASE64 (App Store Connect API-nøkkel med Admin-rolle), IOS_TEAM_ID
# Signering: Xcodes automatiske signering med API-nøkkelen (-allowProvisioningUpdates). Xcode lager sertifikat og profiler
# selv, så det trengs ingen .p12 eller profiler i hemmelighetene. Nøkkelfila skrives til $RUNNER_TEMP og slettes til slutt.
name: TestFlight

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      app:
        description: 'Hvilken app som lastes opp'
        type: choice
        options: [alle, homelab, kalender, kalender-mac]
        default: alle

permissions:
  contents: read

concurrency:
  group: testflight-${{ github.ref }}
  cancel-in-progress: false

jobs:
  hemmeligheter:
    runs-on: ubuntu-latest
    outputs:
      klar: ${{ steps.sjekk.outputs.klar }}
      apper: ${{ steps.sjekk.outputs.apper }}
    steps:
      - name: Sjekk TestFlight-hemmeligheter
        id: sjekk
        env:
          # Bare 'true'/'false' – selve verdiene eksponeres ikke her.
          HAR_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAR_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAR_KEY_P8: ${{ secrets.ASC_KEY_P8_BASE64 != '' }}
          HAR_TEAM_ID: ${{ secrets.IOS_TEAM_ID != '' }}
          VALG: ${{ github.event.inputs.app || 'alle' }}
        run: |
          MANGLER=""
          [ "$HAR_KEY_ID" = "true" ] || MANGLER="$MANGLER ASC_KEY_ID"
          [ "$HAR_ISSUER_ID" = "true" ] || MANGLER="$MANGLER ASC_ISSUER_ID"
          [ "$HAR_KEY_P8" = "true" ] || MANGLER="$MANGLER ASC_KEY_P8_BASE64"
          [ "$HAR_TEAM_ID" = "true" ] || MANGLER="$MANGLER IOS_TEAM_ID"
          if [ -n "$MANGLER" ]; then
            echo "::warning title=TestFlight::Mangler TestFlight-hemmeligheter:$MANGLER. Hopper over opplastingen, se docs/testflight.md."
            echo "## Mangler TestFlight-hemmeligheter" >> "$GITHUB_STEP_SUMMARY"
            echo "Ikke satt:$MANGLER. Se docs/testflight.md." >> "$GITHUB_STEP_SUMMARY"
            echo "klar=false" >> "$GITHUB_OUTPUT"
            echo "apper=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # produkt = navnet på .app-en i arkivet, plugins = der widgeten ligger i appen.
          HOMELAB='{"navn": "Homelab", "scheme": "FinansHub", "bundle": "no.kristo.finanshub", "widget": "FinansHubWidgets", "mal": "generic/platform=iOS", "produkt": "FinansHub", "plugins": "PlugIns", "mac": false}'
          KALENDER='{"navn": "Kalender", "scheme": "Kalender", "bundle": "no.kristo.kalender", "widget": "KalenderWidgets", "mal": "generic/platform=iOS", "produkt": "Kalender", "plugins": "PlugIns", "mac": false}'
          KALMAC='{"navn": "Kalender for Mac", "scheme": "KalenderMac", "bundle": "no.kristo.kalender", "widget": "KalenderMacWidgets", "mal": "generic/platform=macOS", "produkt": "Kalender", "plugins": "Contents/PlugIns", "mac": true}'
          case "$VALG" in
            homelab) APPER="[$HOMELAB]" ;;
            kalender) APPER="[$KALENDER]" ;;
            kalender-mac) APPER="[$KALMAC]" ;;
            *) APPER="[$HOMELAB, $KALENDER, $KALMAC]" ;;
          esac
          echo "klar=true" >> "$GITHUB_OUTPUT"
          echo "apper=$APPER" >> "$GITHUB_OUTPUT"
          echo "TestFlight-hemmeligheter funnet. Laster opp: $VALG."

  testflight:
    needs: hemmeligheter
    if: needs.hemmeligheter.outputs.klar == 'true'
    name: TestFlight (${{ matrix.navn }})
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.hemmeligheter.outputs.apper) }}
    # Samme runner som release.yml (Xcode 26 / iOS 26-SDK, som App Store Connect krever).
    runs-on: macos-26
    # Henger signeringen (f.eks. en nøkkelring som venter på svar), stopper jobben i stedet for å gå i seks timer.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4

      - name: Versjon og build-nummer
        # Marketing-versjonen er den øverste «## [x.y.z]» i CHANGELOG.md (som serveren). Build-nummeret er kjøringens
        # nummer og forsøk (f.eks. 57.1), så det alltid øker og en ny kjøring av samme jobb ikke kolliderer med den forrige.
        run: |
          V=$(grep -m1 -oE '^## \[[0-9]+\.[0-9]+\.[0-9]+\]' ../../CHANGELOG.md | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          [ -n "$V" ] || { echo "::error title=Versjon::Fant ingen «## [x.y.z]» øverst i CHANGELOG.md."; exit 1; }
          BUILD="${{ github.run_number }}.${{ github.run_attempt }}"
          if [ "${{ github.ref_type }}" = "tag" ] && [ "${{ github.ref_name }}" != "v$V" ]; then
            echo "::warning title=Versjon::Taggen ${{ github.ref_name }} er ikke lik versjonen i CHANGELOG.md ($V). TestFlight får $V."
          fi
          echo "V=$V" >> "$GITHUB_ENV"
          echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          echo "${{ matrix.navn }} $V ($BUILD)"

      - name: Klokka i Homelab-appen (bare TestFlight)
        # App Store krever at en klokke-app med følgeapp (WKCompanionAppBundleIdentifier) ligger i iPhone-appen (Watch/).
        # I project.yml er HomelabWatch et eget target, så de usignerte byggene (release.yml, mobile.yml) er uendret. Her får
        # FinansHub klokka som innebygd avhengighet før xcodegen, og arkivet sjekkes etterpå.
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          if [ "$SCHEME" = FinansHub ]; then
            python3 - <<'PY'
          p = 'project.yml'
          s = open(p).read()
          i = s.index('\n  FinansHub:\n'); j = s.index('\n  FinansHubWidgets:\n')
          a = '      - target: FinansHubWidgets\n        embed: true\n'
          assert s[i:j].count(a) == 1, 'fant ikke widget-avhengigheten i FinansHub'
          blk = s[i:j].replace(a, a + '      - target: HomelabWatch\n        embed: true\n')
          open(p, 'w').write(s[:i] + blk + s[j:])
          PY
            grep -n "target: HomelabWatch" project.yml
          fi

      - name: Installer XcodeGen og generer prosjekt
        run: brew install xcodegen && xcodegen generate

      - name: Push for Live Activities og varsler (bare Homelab, bare TestFlight)
        # aps-environment legges bare inn her, ikke i project.yml: de usignerte byggene (release.yml, mobile.yml, sideloading)
        # ville ellers mistet signaturen. Xcode setter «production» ved eksport til App Store Connect.
        env:
          SCHEME: ${{ matrix.scheme }}
        run: |
          if [ "$SCHEME" = FinansHub ]; then
            /usr/libexec/PlistBuddy -c "Add :aps-environment string development" FinansHub/FinansHub.entitlements
          fi

      - name: Kalender for Mac i App Store-form (bare TestFlight)
        # App Store godtar ikke de midlertidige unntakene i sandkassen (/Applications og /Volumes), som bare trengs av appens
        # egen oppdaterer. TestFlight oppdaterer appen selv, så oppdatereren slås av (KAL_APP_STORE=YES i arkiveringen).
        # App Group-en for skrivebords-widgetene slås på her (den krever Team ID og ligger derfor ikke i project.yml).
        if: matrix.mac
        run: |
          # Universelt kjøp: Mac-appen ligger i samme app i App Store Connect som iPhone-appen (Skjold Kalender), så den
          # får de samme bundle-id-ene her. DMG-en i Releases beholder no.kristo.kalender.mac(.widgets).
          P=FinansHub.xcodeproj/project.pbxproj
          sed -i '' -e 's/PRODUCT_BUNDLE_IDENTIFIER = no\.kristo\.kalender\.mac\.widgets;/PRODUCT_BUNDLE_IDENTIFIER = no.kristo.kalender.widgets;/' \
                    -e 's/PRODUCT_BUNDLE_IDENTIFIER = no\.kristo\.kalender\.mac;/PRODUCT_BUNDLE_IDENTIFIER = no.kristo.kalender;/' "$P"
          ! grep -q "no\.kristo\.kalender\.mac" "$P" || { echo "::error::Fant fortsatt no.kristo.kalender.mac i prosjektet"; exit 1; }
          E=KalenderMac/KalenderMac.entitlements
          /usr/libexec/PlistBuddy -c "Delete :com.apple.security.temporary-exception.files.absolute-path.read-write" "$E" || true
          /usr/libexec/PlistBuddy -c "Delete :com.apple.security.temporary-exception.files.absolute-path.read-only" "$E" || true
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups array" "$E"
          /usr/libexec/PlistBuddy -c "Add :com.apple.security.application-groups:0 string \$(TeamIdentifierPrefix)group.no.kristo.kalender" "$E"
          ! grep -q temporary-exception "$E" || { echo "::error::Unntakene i sandkassen er fortsatt med"; exit 1; }

      - name: App Store Connect-nøkkel og midlertidig nøkkelring
        # Nøkkelen dekodes rett til fil (aldri til loggen). Den midlertidige nøkkelringen er standard under jobben, så
        # sertifikatet Xcode lager havner der og slettes sammen med den til slutt.
        env:
          KEY_P8_B64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEY_P8_B64" | base64 --decode > "$RUNNER_TEMP/AuthKey_testflight.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/AuthKey_testflight.p8" || {
            echo "::error title=TestFlight::ASC_KEY_P8_BASE64 er ikke en base64-kodet .p8-nøkkel, se docs/testflight.md."; exit 1; }
          KC="$RUNNER_TEMP/testflight.keychain-db"
          KP=$(uuidgen)
          security create-keychain -p "$KP" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KP" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          security default-keychain -s "$KC"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey_testflight.p8" >> "$GITHUB_ENV"

      - name: Arkiver ${{ matrix.navn }}
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          SCHEME: ${{ matrix.scheme }}
        run: |
          EKSTRA=()
          # Mac: project.yml signerer ad hoc («-») for lokale bygg; her signerer Xcode med teamet, og oppdatereren er av.
          if [ "${{ matrix.mac }}" = "true" ]; then EKSTRA=(KAL_APP_STORE=YES "CODE_SIGN_IDENTITY=Apple Development"); fi
          xcodebuild -project FinansHub.xcodeproj -scheme "$SCHEME" -configuration Release \
            -destination "${{ matrix.mal }}" -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            MARKETING_VERSION="$V" CURRENT_PROJECT_VERSION="$BUILD" \
            DEVELOPMENT_TEAM="$TEAM_ID" CODE_SIGN_STYLE=Automatic \
            "${EKSTRA[@]}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" \
            archive > archive.log 2>&1 && s=0 || s=$?
          grep -E ": error: |: fatal error: |error: No |requires a provisioning profile|Signing for " archive.log | sort -u | head -80 || true
          tail -25 archive.log
          [ $s -eq 0 ] || exit $s
          # Widgetene og App Group-en skal være med i den signerte appen.
          APP="$RUNNER_TEMP/$SCHEME.xcarchive/Products/Applications/${{ matrix.produkt }}.app"
          [ -d "$APP/${{ matrix.plugins }}/${{ matrix.widget }}.appex" ] || { echo "::error::Fant ikke ${{ matrix.widget }} i arkivet"; exit 1; }
          codesign -d --entitlements - "$APP" 2>/dev/null | grep -q "group.no.kristo" || { echo "::error::Mangler App Group i signaturen"; exit 1; }
          if [ "$SCHEME" = FinansHub ]; then
            [ -d "$APP/Watch/FinansHubWatch.app" ] || { echo "::error::Fant ikke klokke-appen (Watch/FinansHubWatch.app) i Homelab-appen"; exit 1; }
            codesign -d --entitlements - "$APP" 2>/dev/null | grep -q aps-environment || { echo "::error::Mangler push (aps-environment) i signaturen. Slå på Push Notifications for no.kristo.finanshub i Apple Developer."; exit 1; }
          fi

      - name: Eksporter og last opp ${{ matrix.navn }} til TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          SCHEME: ${{ matrix.scheme }}
        run: |
          sed "s/__TEAM_ID__/$TEAM_ID/" ../../.github/ios-ExportOptions-testflight.plist > "$RUNNER_TEMP/ExportOptions-testflight.plist"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/$SCHEME.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-testflight.plist" -exportPath "$RUNNER_TEMP/export-$SCHEME" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$KEY_ID" \
            -authenticationKeyIssuerID "$ISSUER_ID" > export.log 2>&1 && s=0 || s=$?
          grep -iE "error|upload|succeeded|failed" export.log | sort -u | head -60 || true
          tail -25 export.log
          [ $s -eq 0 ] || exit $s
          {
            echo "## ${{ matrix.navn }} $V ($BUILD) er lastet opp"
            echo "Bundle-id \`${{ matrix.bundle }}\`. Builden dukker opp i App Store Connect → TestFlight etter behandlingen (vanligvis 5–30 minutter)."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Slett nøkkelen og nøkkelringen
        if: always()
        # Fra roten av arbeidsmappa, så steget også kjører når checkout feilet.
        working-directory: ${{ github.workspace }}
        run: |
          rm -f "$RUNNER_TEMP"/AuthKey_*.p8 "$RUNNER_TEMP/ExportOptions-testflight.plist"
          security delete-keychain "$RUNNER_TEMP/testflight.keychain-db" 2>/dev/null || true
