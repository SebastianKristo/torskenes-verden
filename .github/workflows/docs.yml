# Bygger dokumentasjonssiden (MkDocs Material, mkdocs.yml + docs/site/) og publiserer den til GitHub Pages:
# https://sebastiankristo.github.io/torskenes-verden/
# Første gang: Settings → Pages → Source: «GitHub Actions» hvis configure-pages ikke får slått det på selv.
name: Dokumentasjon

on:
  push:
    branches: [main]
    paths: ['docs/**', 'mkdocs.yml', '.github/workflows/docs.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Hent repoet
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer MkDocs Material
        run: pip install mkdocs-material==9.7.7

      - name: Bygg siden
        run: mkdocs build --strict

      - name: Sett opp Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Last opp siden
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publiser til GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
