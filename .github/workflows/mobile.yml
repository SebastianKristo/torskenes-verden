name: Mobilapper
on:
  push:
    branches: [main]
    # Fase 4: også når fasitene endres (HomelabTests leser shared/testvektorer og shared/schemas/eksempler).
    paths: ['apps/**', 'shared/testvektorer/**', 'shared/schemas/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    env:
      # 'true' når signeringsnøkkelen er lagt inn som hemmelighet (docs/android-signering.md). Selve verdien eksponeres ikke her.
      HAR_ANDROID_NOKKEL: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Signeringsnøkkel fra hemmeligheter (valgfri)
        # Kjører bare når ANDROID_KEYSTORE_BASE64 finnes (env-verdi, ikke secrets direkte i if). Nøkkelen dekodes til en fil
        # utenfor repoet, og Gradle leser ANDROID_KEYSTORE_* fra miljøet (apps/android/build.gradle.kts). Ingenting skrives til logg.
        if: env.HAR_ANDROID_NOKKEL == 'true'
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          umask 077
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/android-signering.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/android-signering.jks" >> "$GITHUB_ENV"
      - name: Uten signeringsnøkkel
        # Bygget går videre (assembleDebug), men APK-ene signeres med runnerens debug-nøkkel og kan ikke installeres over en
        # tidligere installert versjon.
        if: env.HAR_ANDROID_NOKKEL != 'true'
        run: echo "::warning title=Android-signering::ANDROID_KEYSTORE_* er ikke satt. APK-ene er signert med Androids standard debug-nøkkel og kan ikke installeres over en tidligere installert versjon. Se docs/android-signering.md."
      - name: Bygg APK
        env:
          # Tomme uten hemmeligheter – da signerer Gradle debug-byggene med standard debug-nøkkel (og advarer).
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FinansHub-android
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/kalender/build/outputs/apk/debug/kalender-debug.apk
            apps/android/wear/build/outputs/apk/debug/wear-debug.apk

  ios:
    strategy:
      fail-fast: false
      matrix:
        # macOS 15 / Xcode 16 bygger reserve-stien; macOS 26 / Xcode 26 bygger med ekte Liquid Glass (.glassEffect).
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner == 'macos-26' }}
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Generer Xcode-prosjekt
        run: xcodegen generate
      - name: Bygg for simulator
        run: |
          xcodebuild -project FinansHub.xcodeproj -scheme FinansHub -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && s=0 || s=$?
          # Vis kompilatorfeilene (ikke bare halen av loggen).
          grep -E ": error: |: fatal error: " build.log | sort -u | head -80 || true
          tail -25 build.log
          exit $s
      - name: Bygg Kalender-appen for simulator
        run: |
          xcodebuild -project FinansHub.xcodeproj -scheme Kalender -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > kal.log 2>&1 && s=0 || s=$?
          grep -E ": error: |: fatal error: " kal.log | sort -u | head -80 || true
          tail -25 kal.log
          exit $s
      - name: Enhetstester (HomelabTests, simulator)
        # Fase 4 (Q25): fasitene i shared/testvektorer og eksemplene i shared/schemas/eksempler mot appenes lokale logikk og
        # DTO-ene. Logiske tester uten vertsapp, så de trenger ingen signering. Nyeste tilgjengelige iPhone-simulator.
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; ids=[x["udid"] for k,v in sorted(d.items()) if "iOS" in k for x in v if x["name"].startswith("iPhone")]; print(ids[-1] if ids else "")')
          echo "Simulator: $UDID"
          test -n "$UDID" || { echo "Fant ingen iPhone-simulator"; exit 1; }
          xcodebuild test -project FinansHub.xcodeproj -scheme HomelabTests \
            -destination "platform=iOS Simulator,id=$UDID" CODE_SIGNING_ALLOWED=NO > test.log 2>&1 && s=0 || s=$?
          grep -E ": error: |: fatal error: |Test Case .* failed|Executed [0-9]+ test|DateVectorTests:" test.log | sort -u | head -80 || true
          tail -25 test.log
          exit $s
      - name: Bygg Kalender for Mac
        run: |
          xcodebuild -project FinansHub.xcodeproj -scheme KalenderMac -configuration Debug \
            -destination 'generic/platform=macOS' \
            CODE_SIGNING_ALLOWED=NO build > mac.log 2>&1 && s=0 || s=$?
          grep -E ": error: |: fatal error: " mac.log | sort -u | head -80 || true
          tail -25 mac.log
          exit $s
      - name: Bygg Homelab for Apple Watch (simulator)
        # Prompt 51: eget target uten avhengighet til FinansHub. Første gang uten å stoppe jobben (watchOS-SDK på runneren).
        continue-on-error: true
        run: |
          xcodebuild -project FinansHub.xcodeproj -scheme HomelabWatch -configuration Debug \
            -sdk watchsimulator -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > watch.log 2>&1 && s=0 || s=$?
          grep -E ": error: |: fatal error: " watch.log | sort -u | head -80 || true
          tail -25 watch.log
          exit $s
      - name: Start Kalender for Mac (røyktest)
        # Bygger som i releasen (Release, ad hoc-signert med sandkasse), starter appen og viser krasjrapporten hvis den dør.
        if: matrix.runner == 'macos-15'
        continue-on-error: true
        run: |
          xcodebuild -project FinansHub.xcodeproj -scheme KalenderMac -configuration Release \
            -destination 'generic/platform=macOS' -derivedDataPath buildsmoke \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build > smoke.log 2>&1 || { tail -30 smoke.log; exit 1; }
          APP=buildsmoke/Build/Products/Release/Kalender.app
          codesign --force --deep --options runtime -s - --entitlements KalenderMac/KalenderMac.entitlements "$APP"
          codesign -d --entitlements - "$APP" || true
          rm -f ~/Library/Logs/DiagnosticReports/Kalender* 2>/dev/null || true
          "$APP/Contents/MacOS/Kalender" > run.log 2>&1 &
          PID=$!
          sleep 25
          if kill -0 $PID 2>/dev/null; then echo "✓ Kalender kjører etter 25 s"; kill $PID; OK=0; else wait $PID; echo "✗ Kalender avsluttet med kode $?"; OK=1; fi
          echo "--- stdout/stderr"; tail -60 run.log
          for f in ~/Library/Logs/DiagnosticReports/Kalender*; do [ -f "$f" ] && { echo "--- $f"; head -c 12000 "$f"; }; done
          log show --last 2m --style compact --predicate 'process == "Kalender" OR eventMessage CONTAINS "Kalender"' 2>/dev/null | grep -iE "crash|fatal|error|termin|sandbox|deny|signal" | tail -60 || true
          exit $OK
      # Usignert .ipa for sideloading: AltStore/SideStore/Sideloadly signerer den med din egen Apple-ID ved installasjon.
      - name: Bygg usignert .ipa
        if: matrix.runner == 'macos-26'
        run: |
          xcodebuild -project FinansHub.xcodeproj -scheme FinansHub -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -20
          test ${PIPESTATUS[0]} -eq 0
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/FinansHub.app Payload/
          # Ad hoc-signatur med entitlements, så AltStore/SideStore/Sideloadly ser App Group-en
          # og gir widgetene tilgang til innloggingen (uten den viser widgetene bare «Logg inn»).
          APPX=Payload/FinansHub.app/PlugIns/FinansHubWidgets.appex
          [ -d "$APPX" ] && codesign -f -s - --entitlements FinansHubWidgets/FinansHubWidgets.entitlements "$APPX"
          codesign -f -s - --entitlements FinansHub/FinansHub.entitlements Payload/FinansHub.app
          codesign -d --entitlements - Payload/FinansHub.app 2>/dev/null | grep -q application-groups || { echo "Mangler App Group i signaturen"; exit 1; }
          zip -qry FinansHub-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'macos-26'
        with:
          name: FinansHub-ios-unsigned
          path: apps/ios/FinansHub-unsigned.ipa
