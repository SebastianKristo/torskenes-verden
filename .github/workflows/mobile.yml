name: Mobilapper
on:
  push:
    branches: [main]
    paths: ['apps/**', '.github/workflows/mobile.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Bygg APK
        run: ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: FinansHub-android
          path: |
            apps/android/app/build/outputs/apk/debug/app-debug.apk
            apps/android/kalender/build/outputs/apk/debug/kalender-debug.apk

  ios:
    strategy:
      fail-fast: false
      matrix:
        # macOS 15 / Xcode 16 bygger reserve-stien; macOS 26 / Xcode 26 bygger med ekte Liquid Glass (.glassEffect).
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.runner == 'macos-26' }}
    defaults:
      run:
        working-directory: apps/ios
    steps:
      - uses: actions/checkout@v4
      - name: Installer XcodeGen
        run: brew install xcodegen
      - name: Generer Xcode-prosjekt
        run: xcodegen generate
      - name: Bygg for simulator
        run: |
          xcodebuild -project FinansHub.xcodeproj -scheme FinansHub -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > build.log 2>&1 && s=0 || s=$?
          # Vis kompilatorfeilene (ikke bare halen av loggen).
          grep -E ": error: |: fatal error: " build.log | sort -u | head -80 || true
          tail -25 build.log
          exit $s
      - name: Bygg Kalender-appen for simulator
        run: |
          xcodebuild -project FinansHub.xcodeproj -scheme Kalender -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build > kal.log 2>&1 && s=0 || s=$?
          grep -E ": error: |: fatal error: " kal.log | sort -u | head -80 || true
          tail -25 kal.log
          exit $s
      # Usignert .ipa for sideloading: AltStore/SideStore/Sideloadly signerer den med din egen Apple-ID ved installasjon.
      - name: Bygg usignert .ipa
        if: matrix.runner == 'macos-26'
        run: |
          xcodebuild -project FinansHub.xcodeproj -scheme FinansHub -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -20
          test ${PIPESTATUS[0]} -eq 0
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/FinansHub.app Payload/
          # Ad hoc-signatur med entitlements, så AltStore/SideStore/Sideloadly ser App Group-en
          # og gir widgetene tilgang til innloggingen (uten den viser widgetene bare «Logg inn»).
          APPX=Payload/FinansHub.app/PlugIns/FinansHubWidgets.appex
          [ -d "$APPX" ] && codesign -f -s - --entitlements FinansHubWidgets/FinansHubWidgets.entitlements "$APPX"
          codesign -f -s - --entitlements FinansHub/FinansHub.entitlements Payload/FinansHub.app
          codesign -d --entitlements - Payload/FinansHub.app 2>/dev/null | grep -q application-groups || { echo "Mangler App Group i signaturen"; exit 1; }
          zip -qry FinansHub-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        if: matrix.runner == 'macos-26'
        with:
          name: FinansHub-ios-unsigned
          path: apps/ios/FinansHub-unsigned.ipa
