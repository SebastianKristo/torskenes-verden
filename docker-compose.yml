services:
  os:
    build: .
    image: homelab-os:local
    container_name: homelab-os
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Oslo
    volumes:
      - ./data:/data
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3000}:3000"   # BIND_ADDR=0.0.0.0 for LAN-tilgang

  cloudflared:
    profiles: [tunnel]   # start med: docker compose --profile tunnel up -d
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [os]
