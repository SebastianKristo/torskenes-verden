services:
  os:
    build: .
    image: homelab-os:local
    container_name: homelab-os
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Oslo
    volumes:
      - ./data:/data
      # Systembackup (Innstillinger → Backup): egen disk på Proxmox-verten, og BACKUP_DIR=/srv/backup i .env.
      # Uten dette havner backupene i data/system-backups.
      # - /srv/backup:/srv/backup
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-3000}:3000"   # BIND_ADDR=0.0.0.0 for LAN-tilgang
    # Prompt 45: os når Docker-proxyen (homelab-docker) på det interne nettet docker-api. os får aldri selve socketen.
    networks: [default, docker-api]

  # Updater: «Oppdater nå» i Innstillinger → System (se deploy/updater/updater.sh).
  # Den har Docker-socketen, og det er i praksis root i LXC-en. Derfor er den skilt ut fra os, som aldri får Docker-tilgang:
  # ingen porter, den leser bare data/update/request.json (bare en id), og repo/branch kommer fra miljøet her, aldri fra appen.
  # .env, data/ og proton/ røres ikke. Prosjektmappen monteres på SAMME sti som på verten (${PWD}), så ./data-stiene compose
  # sender videre til Docker stemmer. Kjør derfor alltid compose fra prosjektmappen: cd /opt/homelab-os && docker compose …
  updater:
    build: ./deploy/updater
    image: homelab-updater:local
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - .:${PWD}
    environment:
      HOST_DIR: ${PWD}
      UPDATE_REPO: ${UPDATE_REPO:-SebastianKristo/torskenes-verden}
      UPDATE_BRANCH: ${UPDATE_BRANCH:-main}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-}
      TZ: Europe/Oslo

  # Prompt 45: Innstillinger → Server → Logger virker uten ekstra oppsett. Docker-socket-proxyen er en fast del av stacken
  # (updateren legger den til ved neste oppdatering og gjenbruker en proxy du har lagt inn selv – se ensure_docker_proxy i
  # deploy/updater/updater.sh). Strengere enn standarden: fast versjonstag, POST=0, og bare start/stopp/omstart er åpnet (ALLOW_*).
  # Ingen EXEC, IMAGES, VOLUMES, NETWORKS eller BUILD, så ingen kan lage nye containere gjennom den. Socketen er :ro, ingen porter,
  # og den ligger bare på det interne nettet docker-api (ingen internett). os bruker tcp://homelab-docker:2375 (DOCKER_HOST i .env
  # overstyrer). Restart/stopp krever fortsatt admin og bekreftelse i Homelab-API-et. (Erstatter profilen «logs» fra prompt 44.)
  homelab-docker:
    image: tecnativa/docker-socket-proxy:0.2.0
    container_name: homelab-docker
    restart: unless-stopped
    environment:
      CONTAINERS: 1
      LOGS: 1
      INFO: 1
      EVENTS: 1
      SYSTEM: 1        # bare GET /system/df (diskbruk øverst på Logger)
      POST: 0
      ALLOW_START: 1
      ALLOW_STOP: 1
      ALLOW_RESTARTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    security_opt: [no-new-privileges:true]
    networks: [docker-api]

  cloudflared:
    profiles: [tunnel]   # start med: docker compose --profile tunnel up -d
    image: cloudflare/cloudflared:2025.10.0
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on: [os]

  # Proton Mail Bridge: kvitteringer fra e-post inn i FinansHub (Innstillinger → Integrasjoner → Proton Mail).
  # Krever betalt Proton-plan. Første gang: docker compose --profile mail run --rm protonmail-bridge init  →  login  →  info  →  exit
  # Fra appen: vert «protonmail-bridge», port 143 (IMAP, STARTTLS). Portene publiseres IKKE – bare containere i samme compose når den.
  protonmail-bridge:
    profiles: [mail]     # start med: docker compose --profile mail up -d
    build: ./deploy/protonmail-bridge       # shenxn/protonmail-bridge + libfido2 (kreves av nyere Bridge)
    image: homelab-protonmail-bridge:local
    restart: unless-stopped
    volumes:
      - ./proton:/root   # nøkler og cache – ta med i backup

networks:
  # Prompt 45: bare os og homelab-docker. internal = ingen trafikk ut til internett.
  docker-api:
    internal: true
