<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap" rel="stylesheet">
<style>html,body{margin:0;height:100%;background:#101a2e}a{color:#ffd9c2}a:hover{color:#fff}@keyframes nsAur{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(4%,-3%) scale(1.08)}}@keyframes nsFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}@keyframes nsOrbit{to{transform:rotate(360deg)}}@keyframes nsZ{0%{opacity:0;transform:translate(0,0) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translate(26px,-46px) scale(1.2)}}@keyframes nsPop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:none;opacity:1}}@keyframes nsSpin{to{transform:rotate(360deg)}}@keyframes nsIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}</style>
<script src="./glimt-figurer.js"></script>
</helmet>
<div style="position:relative;min-height:100vh;overflow:hidden;color:#fff;font-family:Manrope,system-ui,sans-serif;background:linear-gradient(160deg,#101a2e 0%,#1b2340 100%);display:flex;align-items:center;justify-content:center;padding:40px 20px;box-sizing:border-box">
{{ aurora }}
<div style="position:relative;z-index:2;width:100%;max-width:440px;display:flex;flex-direction:column;align-items:center;gap:26px;text-align:center">
{{ hero }}
<div style="display:flex;flex-direction:column;align-items:center;gap:8px">
<span style="font:600 11px 'IBM Plex Mono',monospace;letter-spacing:.16em;color:#ffd9c2">{{ kicker }}</span>
<b style="font:800 40px/1 Manrope;letter-spacing:-.02em">Nordlys<span style="font-weight:500;opacity:.75">OS</span> <span style="background:linear-gradient(180deg,#fff 0%,#ffd9c2 45%,#ff8a5c 100%);-webkit-background-clip:text;background-clip:text;color:transparent">4.29</span></b>
<span style="font:500 16px/1.45 Manrope;color:rgba(255,255,255,.82);text-wrap:pretty;min-height:46px">{{ line }}</span>
</div>
<div style="width:100%;display:flex;flex-direction:column;border-radius:20px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:6px 16px">
<sc-for list="{{ steps }}" as="t" hint-placeholder-count="5"><div style="display:flex;align-items:center;gap:12px;min-height:44px;border-top:{{ t.bt }};opacity:{{ t.op }};transition:opacity .3s">
<span style="flex:none;width:22px;height:22px;display:grid;place-items:center">{{ t.ic }}</span>
<span style="flex:1;min-width:0;text-align:left;font:600 14.5px Manrope">{{ t.n }}</span>
<span style="font:500 12px 'IBM Plex Mono',monospace;color:rgba(255,255,255,.6)">{{ t.ms }}</span>
</div></sc-for>
</div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><span style="font:500 13px Manrope;color:rgba(255,255,255,.65)">{{ foot }}</span><sc-if value="{{ slow }}"><a href="./" style="font:700 13px Manrope">Last inn på nytt nå</a></sc-if></div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
const ST=[['Starter databasen','db',1300],['Kjører migrasjoner','mig',1500],['Starter web og API','api',1200],['Vekker Glimt og AI-modellene','ai',1900],['Kobler til integrasjoner','int',1400]];
const LINES=['Serveren starter på nytt etter oppdateringen. Glimt sover litt …','Glimt våkner og sjekker at alt er på plass.','Nesten klar. Glimt varmer opp modellene.','Alt kjører! Laster inn Homelab …'];
class Component extends DCLogic{
  state={i:0,done:false,t0:Date.now(),tick:0};
  componentDidMount(){this.run();this._iv=setInterval(()=>this.setState(s=>({tick:s.tick+1})),1000);if(!window.GlimtFigMake){let n=0;const p=()=>{if(window.GlimtFigMake)this.forceUpdate();else if(n++<40)this._gp=setTimeout(p,150)};p()}}
  componentWillUnmount(){clearTimeout(this._t);clearInterval(this._iv);clearTimeout(this._gp)}
  run(){const s=this.state;if(s.i>=ST.length){this.setState({done:true});this._t=setTimeout(()=>this.setState({i:0,done:false,t0:Date.now()},()=>this.run()),4200);return}this._t=setTimeout(()=>this.setState(x=>({i:x.i+1}),()=>this.run()),ST[s.i][2])}
  renderVals(){const e=React.createElement,s=this.state,i=s.i,done=s.done;if(!this._F&&window.GlimtFigMake)this._F=window.GlimtFigMake(React);const F=this._F;
    const phase=done?3:i<2?0:i<4?1:2,mood=phase===0?'sleep':phase===3?'talk':'idle',S=128;
    const fig=F?F('glimt',S,mood):e('span',{style:{display:'block',width:S,height:S,borderRadius:'50%',background:'conic-gradient(#b23a2a,#e8794a,#f2c14e,#3fbf9a,#7a5ad6,#b23a2a)'}});
    const pct=done?100:Math.round(i/ST.length*100),R=92,C=2*Math.PI*R;
    const ring=e('svg',{key:'r',width:208,height:208,viewBox:'0 0 208 208',style:{position:'absolute',inset:0,transform:'rotate(-90deg)'}},e('circle',{cx:104,cy:104,r:R,fill:'none',stroke:'rgba(255,255,255,.12)',strokeWidth:5}),e('circle',{cx:104,cy:104,r:R,fill:'none',stroke:'url(#nsG)',strokeWidth:5,strokeLinecap:'round',strokeDasharray:C,strokeDashoffset:C*(1-pct/100),style:{transition:'stroke-dashoffset .6s cubic-bezier(.2,.8,.2,1)'}}),e('defs',null,e('linearGradient',{id:'nsG',x1:0,y1:0,x2:1,y2:1},e('stop',{offset:'0%',stopColor:'#3fbf9a'}),e('stop',{offset:'55%',stopColor:'#ffd9c2'}),e('stop',{offset:'100%',stopColor:'#ff8a5c'}))));
    const orbit=e('span',{key:'o',style:{position:'absolute',inset:0,animation:'nsOrbit 9s linear infinite'}},[0,120,240].map(a=>e('span',{key:a,style:{position:'absolute',left:'50%',top:'50%',width:7,height:7,marginLeft:-3.5,marginTop:-3.5,borderRadius:4,background:a===0?'#ffd9c2':a===120?'#3fbf9a':'#a78bfa',boxShadow:'0 0 10px currentColor',transform:'rotate('+a+'deg) translateY(-104px)'}})));
    const zz=phase===0?[0,1,2].map(k=>e('span',{key:'z'+k,style:{position:'absolute',right:28,top:30,font:'800 '+(14+k*4)+'px Manrope',color:'#ffd9c2',animation:'nsZ 2.4s ease-out '+(k*.8)+'s infinite',opacity:0}},'z')):[];
    const hero=e('span',{key:'h',style:{position:'relative',width:208,height:208,display:'grid',placeItems:'center'}},ring,orbit,e('span',{key:'f',style:{display:'inline-block',animation:'nsFloat 3.2s ease-in-out infinite'}},fig),...zz,e('span',{key:'p',style:{position:'absolute',bottom:-6,left:'50%',transform:'translateX(-50%)',padding:'3px 10px',borderRadius:999,background:'rgba(16,26,46,.8)',border:'1px solid rgba(255,255,255,.18)',font:"600 12px 'IBM Plex Mono',monospace"}},pct+' %'));
    const aurora=e('span',{key:'a',style:{position:'absolute',inset:'-20%',pointerEvents:'none',zIndex:1}},e('span',{style:{position:'absolute',inset:0,background:'radial-gradient(50% 40% at 80% 10%,oklch(0.62 0.17 300 / .7) 0%,transparent 70%),radial-gradient(50% 45% at 15% 90%,oklch(0.72 0.16 165 / .6) 0%,transparent 70%),radial-gradient(40% 35% at 90% 90%,oklch(0.6 0.19 30 / .5) 0%,transparent 70%)',animation:'nsAur 14s ease-in-out infinite',filter:'blur(10px)'}}));
    const ok=e('svg',{width:20,height:20,viewBox:'0 0 24 24',style:{animation:'nsPop .35s cubic-bezier(.3,1.6,.5,1) both'}},e('circle',{cx:12,cy:12,r:11,fill:'#2f7d4f'}),e('path',{d:'M7 12.5l3.2 3.2L17 9',fill:'none',stroke:'#fff',strokeWidth:2.6,strokeLinecap:'round',strokeLinejoin:'round'}));
    const spin=e('span',{style:{display:'block',width:18,height:18,borderRadius:'50%',border:'2.5px solid rgba(255,255,255,.2)',borderTopColor:'#ffd9c2',animation:'nsSpin .8s linear infinite'}});
    const wait=e('span',{style:{display:'block',width:8,height:8,borderRadius:4,background:'rgba(255,255,255,.3)'}});
    const el=Math.floor((Date.now()-s.t0)/1000);
    return{aurora,hero,kicker:done?'KLAR':'STARTER OPP',line:LINES[phase],
      steps:ST.map(([n,,ms],k)=>({n,bt:k?'1px solid rgba(255,255,255,.1)':'0',op:k<=i||done?'1':'.45',ic:k<i||done?ok:k===i?spin:wait,ms:k<i||done?(ms/1000).toFixed(1).replace('.',',')+' s':k===i?'…':''})),
      foot:done?'Laster inn siden …':'Siden lastes inn automatisk når serveren svarer · '+el+' s',slow:!done&&el>40}}
}
</script>
</body>
</html>
