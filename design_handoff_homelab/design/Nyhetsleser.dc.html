<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&amp;family=Manrope:wght@400;500;600;700&amp;family=IBM+Plex+Mono:wght@500;600&amp;display=swap">
</helmet>
<div style="--ink:{{ c.ink }};--bg:{{ c.bg }};--card:{{ c.card }};--line:{{ c.line }};--lab:{{ c.lab }};--mut:{{ c.mut }};position:relative;height:100%;min-height:{{ minH }};background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,sans-serif;display:flex;flex-direction:column;border-radius:{{ rad }};overflow:hidden">
<div style="flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:{{ hPad }}">
<div style="display:flex;align-items:center;gap:10px;min-width:0"><sc-if value="{{ hasBack }}"><button onClick="{{ back }}" style="flex:none;height:36px;padding:0 14px 0 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font:600 13px Manrope;white-space:nowrap">‹ Tilbake</button></sc-if><div style="min-width:0"><div style="font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--lab)">NYHETSLESER · {{ feedN }} KILDER · OPPDATERT 09:14</div><div style="font:500 {{ titleS }} Newsreader,serif;line-height:1.05">Siste nytt</div></div></div>
<button onClick="{{ setOpen }}" aria-label="Kilder og AI" style="flex:none;width:40px;height:40px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;display:grid;place-items:center"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM4 12h2M18 12h2M12 4v2M12 18v2M6.3 6.3l1.4 1.4M16.3 16.3l1.4 1.4M6.3 17.7l1.4-1.4M16.3 7.7l1.4-1.4"></path></svg></button>
</div>
<div style="flex:none;display:flex;gap:18px;padding:0 {{ sidePad }};border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;white-space:nowrap"><sc-for list="{{ tabs }}" as="t"><button onClick="{{ t.go }}" style="flex:none;padding:6px 0 10px;border:0;border-bottom:2px solid {{ t.bd }};background:transparent;color:{{ t.fg }};cursor:pointer;font:600 14px Manrope">{{ t.n }}</button></sc-for></div>
<div style="flex:1;min-height:0;overflow-y:auto;scrollbar-width:none;padding:16px {{ sidePad }} 28px;display:grid;grid-template-columns:{{ cols }};gap:22px;align-content:start">
<div style="display:flex;flex-direction:column;gap:8px;grid-column:1 / -1"><sc-if value="{{ aiS }}"><span style="font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--lab)">✦ AI-SAMMENDRAG</span></sc-if><div style="font:italic 400 {{ leadS }} Newsreader,serif;line-height:1.35;text-wrap:pretty;max-width:820px">{{ lead }}</div></div>
<sc-for list="{{ groups }}" as="g"><div style="display:flex;flex-direction:column;min-width:0"><sc-if value="{{ g.showH }}"><div style="font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--lab);padding-bottom:6px;border-bottom:2px solid var(--ink)">{{ g.n }}</div></sc-if>
<sc-for list="{{ g.items }}" as="x"><a href="{{ x.url }}" target="_blank" style="color:inherit;text-decoration:none;display:flex;gap:14px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line)"><sc-if value="{{ x.showCat }}"><span style="flex:none;width:74px;font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--lab)">{{ x.cat }}</span></sc-if><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;line-height:1.35">{{ x.t }}</span><span style="font-size:12px;color:var(--mut)">{{ x.src }} · {{ x.time }}{{ x.aiT }}</span></span><span style="color:var(--mut)">›</span></a></sc-for></div></sc-for>
</div>
<sc-if value="{{ set }}"><div onClick="{{ setClose }}" style="position:absolute;inset:0;z-index:9;background:rgba(0,0,0,.35);display:flex;align-items:{{ sheetAlign }};justify-content:flex-end"><div onClick="{{ stop }}" style="width:{{ sheetW }};max-height:{{ sheetH }};height:{{ sheetHH }};overflow-y:auto;scrollbar-width:none;border-radius:{{ sheetR }};background:var(--bg);color:var(--ink);padding:16px 18px 30px;display:flex;flex-direction:column;gap:14px;box-sizing:border-box">
<div style="display:flex;justify-content:space-between;align-items:center"><div><div style="font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--lab)">NYHETSLESER</div><div style="font:500 26px Newsreader,serif">Kilder og AI</div></div><button onClick="{{ setClose }}" style="height:36px;padding:0 16px;border-radius:999px;border:0;background:var(--ink);color:var(--bg);cursor:pointer;font:700 13px Manrope">Ferdig</button></div>
<div style="border-radius:18px;background:var(--card);overflow:hidden"><sc-for list="{{ togs }}" as="t"><button onClick="{{ t.go }}" style="display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border:0;border-top:{{ t.bt }};background:transparent;color:var(--ink);cursor:pointer;text-align:left;font-family:Manrope"><span style="flex:1;min-width:0"><b style="display:block;font-size:14.5px;font-weight:600">{{ t.n }}</b><span style="font-size:12.5px;color:var(--mut);line-height:1.4">{{ t.s }}</span></span><span style="flex:none;width:46px;height:28px;border-radius:14px;background:{{ t.tr }};padding:3px;display:flex;justify-content:{{ t.j }};box-sizing:border-box"><span style="width:22px;height:22px;border-radius:11px;background:#fff"></span></span></button></sc-for></div>
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font:600 10.5px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:var(--lab)">ADRESSER · {{ feedN }}</span><span style="font-size:12px;color:var(--mut)">Trykk på kategorien for å endre</span></div>
<div style="border-radius:18px;background:var(--card);overflow:hidden"><sc-for list="{{ feeds }}" as="f"><div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:{{ f.bt }}"><span style="flex:none;width:34px;height:34px;border-radius:9px;background:{{ f.c }};color:#fff;display:grid;place-items:center;font:700 10px Manrope">{{ f.ini }}</span><span style="flex:1;min-width:0"><b style="display:block;font-size:14px;font-weight:600">{{ f.n }}</b><span style="display:block;font:500 11.5px 'IBM Plex Mono',monospace;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ f.u }}</span></span><button onClick="{{ f.cyc }}" style="flex:none;height:30px;padding:0 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;font:600 12px Manrope;white-space:nowrap">{{ f.cat }} ▾</button><button onClick="{{ f.del }}" aria-label="Fjern" style="flex:none;width:28px;height:28px;border-radius:8px;border:0;background:transparent;color:var(--mut);cursor:pointer;font-size:16px">×</button></div></sc-for></div>
<form onSubmit="{{ add }}" style="display:flex;flex-direction:column;gap:8px"><input value="{{ nf }}" onChange="{{ onNf }}" placeholder="https://www.nrk.no/toppsaker.rss" style="height:46px;padding:0 14px;border-radius:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:500 14px Manrope;box-sizing:border-box"><button type="submit" style="height:46px;border-radius:14px;border:0;background:var(--lab);color:#fff;cursor:pointer;font:700 14px Manrope">+ Legg til adresse</button><span style="font-size:12px;color:var(--mut);line-height:1.4">{{ nfHint }}</span></form>
</div></div></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;390px&quot;,&quot;height&quot;:&quot;780px&quot;},&quot;variant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;mobile&quot;,&quot;web&quot;],&quot;default&quot;:&quot;mobile&quot;,&quot;tsType&quot;:&quot;'mobile' | 'web'&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onBack&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;}}">
const CATS=['Siste','Norge','Verden','Økonomi','Sport','Teknologi','Kultur'];
const U={NRK:'https://www.nrk.no/',VG:'https://www.vg.no/',E24:'https://e24.no/',Aftenposten:'https://www.aftenposten.no/','Tek.no':'https://www.tek.no/'};
const NW=[['NRK','Kraftig regn ventes på Østlandet i kveld','09:12'],['VG','Ny rekord for elbilsalg i september','09:05'],['NRK','Stortinget behandler statsbudsjettet','08:48'],['E24','Oslo Børs stiger før helgen','08:40'],['VG','Ruter innfører nye nattlinjer fra november','08:31'],['NRK','Snø i fjellet i natt, glatte veier over Haukeli','08:20'],['Aftenposten','Nytt boligprosjekt på Bislett godkjent','08:12'],['E24','Strømprisen faller neste uke','08:02'],['NRK','FN-toppmøte om klima åpner i Genève','07:55'],['VG','Bodø/Glimt klare for kvartfinale','07:46'],['Aftenposten','Valg i Tyskland: tett løp mellom partiene','07:30'],['E24','Equinor kutter i Nordsjøen','07:22'],['NRK','Ny undersøkelse om skjermtid blant unge','07:10'],['VG','Norge til EM-sluttspill i håndball','06:58'],['Tek.no','Ny Android-oppdatering ruller ut i dag','06:44'],['NRK','Flere elbiler enn bensinbiler i Oslo','06:30'],['Aftenposten','Museet åpner nytt bygg i Bjørvika','06:15'],['E24','Kronekursen styrker seg','06:02'],['Tek.no','Test: årets beste trådløse ørepropper','05:50'],['NRK','Nordlys kan ses over Østlandet i kveld','05:41']];
const CAT=t=>/børs|strøm|krone|equinor|elbil/i.test(t)?'Økonomi':/glimt|kvartfinale|håndball/i.test(t)?'Sport':/android|ørepropper|skjermtid/i.test(t)?'Teknologi':/museet|nordlys/i.test(t)?'Kultur':/fn-|tyskland|genève/i.test(t)?'Verden':'Norge';
const F0=[['NRK','https://www.nrk.no/toppsaker.rss','Auto','#c8102e'],['VG','https://www.vg.no/rss/feed','Auto','#d7263d'],['E24','https://e24.no/rss','Økonomi','#1a5a8a'],['Aftenposten','https://www.aftenposten.no/rss','Auto','#2a3440'],['Tek.no','https://www.tek.no/rss','Teknologi','#e05a2a']];
const LD=()=>{try{return JSON.parse(localStorage.getItem('hl_rss')||'null')||{}}catch(e){return{}}};
const PAL={light:{ink:'#1b1a17',bg:'#f3efe6',card:'#fff',line:'#d8d1c2',lab:'#b23a2a',mut:'#8f897c'},dark:{ink:'#ece7dc',bg:'#14130f',card:'#211f19',line:'#34322a',lab:'#e8705c',mut:'#8a8578'},web:{ink:'#eef0f4',bg:'#11151d',card:'#181e29',line:'#262d3b',lab:'#a8d4fb',mut:'#8a93a6'}};
class Component extends DCLogic {
  constructor(p){super(p);const d=LD();this.state={cat:'Siste',set:false,nf:'',feeds:d.feeds||F0,aiS:d.aiS!==false,aiC:d.aiC!==false}}
  sv(o){this.setState(o,()=>{const s=this.state;try{localStorage.setItem('hl_rss',JSON.stringify({feeds:s.feeds,aiS:s.aiS,aiC:s.aiC}))}catch(e){}})}
  renderVals(){const s=this.state,p=this.props,web=p.variant==='web',c=PAL[web?'web':(p.dark?'dark':'light')];
    const on=new Set(s.feeds.map(f=>f[0]));const fc=Object.fromEntries(s.feeds.map(f=>[f[0],f[2]]));
    const all=NW.filter(x=>on.has(x[0])).map(([src,t,time])=>{const fixed=fc[src]&&fc[src]!=='Auto';const k=fixed?fc[src]:(s.aiC?CAT(t):'Norge');return{src,t,time,url:U[src]||'#',c:k,cat:k.toUpperCase(),aiT:!fixed&&s.aiC?' · ✦ AI':''}});
    const fl=all.filter(x=>s.cat==='Siste'||x.c===s.cat);
    const groups=web&&s.cat==='Siste'?CATS.slice(1).map(n=>({n:n.toUpperCase(),showH:true,items:all.filter(x=>x.c===n).map(x=>({...x,showCat:false}))})).filter(g=>g.items.length):[{n:'',showH:false,items:fl.map(x=>({...x,showCat:s.cat==='Siste'}))}];
    const top=fl.slice(0,3).map(x=>x.t.toLowerCase());
    const lead=s.aiS?(fl.length?'I dag: '+top.join(', ').replace(/^./,m=>m)+'.':'Ingen saker i denne kategorien.'):(fl[0]?fl[0].t:'');
    return{c,minH:web?'640px':'100%',rad:web?'24px':'0',hPad:web?'22px 26px 14px':'14px 18px 12px',sidePad:web?'26px':'18px',titleS:web?'38px':'30px',leadS:web?'22px':'19px',cols:web?'repeat(auto-fill,minmax(min(100%,300px),1fr))':'minmax(0,1fr)',
      hasBack:!!p.onBack,back:()=>p.onBack&&p.onBack(),feedN:String(s.feeds.length),aiS:s.aiS,lead,groups,
      tabs:CATS.map(n=>{const a=s.cat===n;return{n,bd:a?c.ink:'transparent',fg:a?c.ink:c.mut,go:()=>this.setState({cat:n})}}),
      set:s.set,setOpen:()=>this.setState({set:true}),setClose:()=>this.setState({set:false}),stop:e=>e.stopPropagation(),
      sheetAlign:web?'stretch':'flex-end',sheetW:web?'440px':'100%',sheetH:web?'100%':'86%',sheetHH:web?'100%':'auto',sheetR:web?'0':'28px 28px 0 0',
      togs:[['aiS','✦ AI-sammendrag','Lager en kort ingress over de viktigste sakene øverst.'],['aiC','✦ AI-kategorisering','Setter kategori per sak når kilden står på Auto.']].map(([k,n,sd],i)=>{const v=s[k];return{n,s:sd,bt:i?'1px solid '+c.line:'0',tr:v?'#2f7a4f':'#9a958a',j:v?'flex-end':'flex-start',go:()=>this.sv({[k]:!v})}}),
      feeds:s.feeds.map(([n,u,cat,col],i)=>({n,u,cat:(cat==='Auto'&&s.aiC?'✦ ':'')+cat,c:col,ini:n.slice(0,2).toUpperCase(),bt:i?'1px solid '+c.line:'0',
        cyc:()=>{const L=['Auto',...CATS.slice(1)];this.sv({feeds:s.feeds.map((f,j)=>j===i?[f[0],f[1],L[(L.indexOf(f[2])+1)%L.length],f[3]]:f)})},del:()=>this.sv({feeds:s.feeds.filter((_,j)=>j!==i)})})),
      nf:s.nf,onNf:e=>this.setState({nf:e.target.value}),nfHint:s.aiC?'✦ AI finner navnet på kilden og foreslår kategori.':'Kategorien settes til Auto.',
      add:e=>{e.preventDefault();const v=s.nf.trim();if(!v)return;const u=/^https?:/.test(v)?v:'https://'+v;let host='Kilde';try{host=new URL(u).hostname.replace(/^www\./,'').split('.')[0]}catch(er){}const n=host.charAt(0).toUpperCase()+host.slice(1);const cat=s.aiC?(/sport|fotball/i.test(u)?'Sport':/tek|tech/i.test(u)?'Teknologi':/e24|dn\.no|finans/i.test(u)?'Økonomi':'Auto'):'Auto';this.sv({feeds:[...s.feeds,[n,u,cat,'#6b665c']],nf:''})}};
  }
}
</script>
</body>
</html>
