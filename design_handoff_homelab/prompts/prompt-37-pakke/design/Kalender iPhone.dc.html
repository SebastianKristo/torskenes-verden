<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500&amp;family=Manrope:wght@500;600;700&amp;display=swap">
<style>body{margin:0;background:#e9e3d6}a{color:#b23a2a}a:hover{color:#8a2a1d}</style>
</helmet>
<div style="min-height:100vh;box-sizing:border-box;padding:48px 24px;display:flex;flex-direction:column;align-items:center;gap:22px;font-family:Manrope,sans-serif;color:#1b1a17">
<div style="position:relative;width:425px;height:884px;flex:none">
<span style="position:absolute;left:-3px;top:178px;width:4px;height:32px;border-radius:2px 0 0 2px;background:linear-gradient(90deg,#6d6a64,#a9a59c)"></span>
<span style="position:absolute;left:-3px;top:236px;width:4px;height:62px;border-radius:2px 0 0 2px;background:linear-gradient(90deg,#6d6a64,#a9a59c)"></span>
<span style="position:absolute;left:-3px;top:312px;width:4px;height:62px;border-radius:2px 0 0 2px;background:linear-gradient(90deg,#6d6a64,#a9a59c)"></span>
<span style="position:absolute;right:-3px;top:268px;width:4px;height:98px;border-radius:0 2px 2px 0;background:linear-gradient(270deg,#6d6a64,#a9a59c)"></span>
<span style="position:absolute;right:-3px;top:520px;width:4px;height:58px;border-radius:0 2px 2px 0;background:linear-gradient(270deg,#6d6a64,#a9a59c)"></span>
<div style="position:absolute;inset:0;border-radius:70px;background:linear-gradient(145deg,#bdb8ae 0%,#8d8980 35%,#c9c4ba 60%,#7d7970 100%);padding:3px;box-sizing:border-box;box-shadow:0 40px 80px -20px rgba(27,26,23,.45),0 10px 24px rgba(27,26,23,.18)">
<div style="width:100%;height:100%;border-radius:67px;background:#0c0c0c;padding:13px;box-sizing:border-box">
<div style="position:relative;width:393px;height:852px;border-radius:55px;overflow:hidden;background:#4a5c50;transform:translateZ(0)">
<div style="position:absolute;inset:0;transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .3s;transform:{{ homeTf }};opacity:{{ homeOp }}"><dc-import name="Kalender App" platform="ios" mode="home" on-open-app="{{ openApp }}" style="display:block;width:100%;height:100%" hint-size="393px,852px"></dc-import></div>
<div style="position:absolute;inset:0;transform-origin:{{ appOrigin }};transition:transform .42s cubic-bezier(.2,.8,.2,1),opacity .28s,border-radius .42s;transform:{{ appTf }};opacity:{{ appOp }};pointer-events:{{ appPe }};border-radius:{{ appR }};overflow:hidden"><dc-import name="Kalender App" platform="ios" link="{{ link }}" on-home="{{ goHome }}" style="display:block;width:100%;height:100%" hint-size="393px,852px"></dc-import></div>
</div></div></div>
</div>
<span style="font-size:13.5px;color:#6b665c;text-align:center;max-width:420px;text-wrap:pretty">Trykk på Kalender-ikonet eller en widget for å åpne appen. Trykk på streken nederst for å gå hjem.</span>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { open: false, link: { n: 0 }, origin: '50% 50%' };
  renderVals() {
    const s = this.state, o = s.open;
    return {
      link: s.link, appOrigin: s.origin,
      appTf: o ? 'scale(1)' : 'scale(.18)', appOp: o ? '1' : '0', appPe: o ? 'auto' : 'none', appR: o ? '0' : '40px',
      homeTf: o ? 'scale(.92)' : 'scale(1)', homeOp: o ? '.0' : '1',
      openApp: (L) => { const n = (s.link.n || 0) + 1, org = L && L.view === 'mnd' ? '50% 55%' : L && L.view === 'dag' && L.t ? '25% 82%' : L && L.view === 'dag' ? '50% 20%' : '75% 82%'; this.setState({ origin: org, link: { n, ...(L || {}), view: (L && L.view) || 'mnd' } }, () => setTimeout(() => this.setState({ open: true }), 20)) },
      goHome: () => this.setState({ open: false })
    };
  }
}
</script>
</body>
</html>
