# Versjonskatalog for :app, :kalender, :wear og de delte modulene :felles og :felles-android.
# Én versjon per bibliotek. Endres en versjon her, gjelder den alle modulene som bruker biblioteket.
# Fase 5: versjonene er de samme som før katalogen (ingen oppgraderinger i samme steg).
#
# Oppgraderingsplan (rest etter 5.0, vurdert 16.11.2026 uten Android SDK i miljøet):
# - AGP 8.7.3 er siste patch i 8.7, så det finnes ingen trygg patch-oppgradering. Kotlin 2.1.0 → 2.1.2x er en egen
#   «tooling release» med ny Compose-kompilator, og Kotlin dokumenterer AGP-støtte bare til 8.7.2 for 2.1-serien.
#   Det er derfor ikke oppgradert her.
# - Neste steg, i én egen gren med CI («Mobilapper») som fasit: AGP, Kotlin (med kotlin.compose-pluginen i samme versjon)
#   og Gradle-wrapperen sammen etter kompatibilitetstabellene i AGP- og Kotlin-dokumentasjonen, så compileSdk/targetSdk 36
#   (krever nyere AGP enn 8.7) og til slutt Compose BOM. Én oppgradering per commit, så CI kan peke ut den som feiler.
# - R8 (isMinifyEnabled) forblir av med vilje til CI har en emulator som kan kjøre appen etter minifisering.

[versions]
agp = "8.7.3"
kotlin = "2.1.0"
composeBom = "2024.12.01"
activityCompose = "1.9.3"
lifecycle = "2.8.7"
coreKtx = "1.15.0"
exifinterface = "1.3.7"
# Avviklet av Google, men 1.0.0 er siste stabile. Oppstarten tåler en ødelagt nøkkel (:felles-android, SikkerLagring).
securityCrypto = "1.0.0"
fragment = "1.8.5"
biometric = "1.1.0"
coroutines = "1.9.0"
glance = "1.1.1"
work = "2.10.0"
osmdroid = "6.1.20"
healthConnect = "1.1.0-alpha07"
okhttp = "4.12.0"
codeScanner = "16.1.0"
mlkitText = "19.0.1"
mlkitDocumentScanner = "16.0.0-beta1"
carApp = "1.4.0"
profileinstaller = "1.4.1"
wearCompose = "1.4.0"
# Enhetstester på JVM (Q25).
junit = "4.13.2"
# org.json til JVM-testene. På Android kommer org.json fra plattformen (compileOnly i :felles).
orgJson = "20240303"

[libraries]
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-foundation = { module = "androidx.compose.foundation:foundation" }
compose-material3 = { module = "androidx.compose.material3:material3" }
compose-material3-windowsize = { module = "androidx.compose.material3:material3-window-size-class" }
compose-material-icons-extended = { module = "androidx.compose.material:material-icons-extended" }
activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
exifinterface = { module = "androidx.exifinterface:exifinterface", version.ref = "exifinterface" }
security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
fragment-ktx = { module = "androidx.fragment:fragment-ktx", version.ref = "fragment" }
biometric = { module = "androidx.biometric:biometric", version.ref = "biometric" }
coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
glance-appwidget = { module = "androidx.glance:glance-appwidget", version.ref = "glance" }
work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
osmdroid = { module = "org.osmdroid:osmdroid-android", version.ref = "osmdroid" }
health-connect = { module = "androidx.health.connect:connect-client", version.ref = "healthConnect" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
play-code-scanner = { module = "com.google.android.gms:play-services-code-scanner", version.ref = "codeScanner" }
play-mlkit-text = { module = "com.google.android.gms:play-services-mlkit-text-recognition", version.ref = "mlkitText" }
play-mlkit-document-scanner = { module = "com.google.android.gms:play-services-mlkit-document-scanner", version.ref = "mlkitDocumentScanner" }
car-app = { module = "androidx.car.app:app", version.ref = "carApp" }
profileinstaller = { module = "androidx.profileinstaller:profileinstaller", version.ref = "profileinstaller" }
wear-compose-material = { module = "androidx.wear.compose:compose-material", version.ref = "wearCompose" }
wear-compose-foundation = { module = "androidx.wear.compose:compose-foundation", version.ref = "wearCompose" }
junit = { module = "junit:junit", version.ref = "junit" }
org-json = { module = "org.json:json", version.ref = "orgJson" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
