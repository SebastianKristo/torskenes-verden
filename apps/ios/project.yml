name: FinansHub
options:
  bundleIdPrefix: no.kristo
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "4.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: ""
targets:
  FinansHub:
    type: application
    platform: iOS
    sources:
      - FinansHub/Sources
      - FinansHub/Resources
      - Shared
    dependencies:
      # Widgetene (WidgetKit) bygges som utvidelse og legges i FinansHub.app/PlugIns.
      - target: FinansHubWidgets
        embed: true
    entitlements:
      path: FinansHub/FinansHub.entitlements
      properties:
        com.apple.security.application-groups:
          - group.no.kristo.finanshub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.kristo.finanshub
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: FinansHub
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Kameraet brukes til å ta bilde av kvitteringer."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Velg kvitteringsbilder fra biblioteket."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID brukes til å låse opp FinansHub."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "FinansHub kobler til homelab-serveren din på lokalt nett."
    info:
      path: FinansHub/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # «Last ned» lagrer kvitteringer i appens mappe, som vises i Filer → På min iPhone → FinansHub.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Fontene i Papir og Mat (OFL, Google Fonts): Newsreader, Manrope, IBM Plex Mono, Instrument Serif og Bricolage Grotesque.
        UIAppFonts:
          - BricolageGrotesque-ExtraBold.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
          - InstrumentSerif-Regular.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - Manrope-Medium.ttf
          - Manrope-Regular.ttf
          - Manrope-SemiBold.ttf
          - Newsreader-Italic.ttf
          - Newsreader-Medium.ttf
          - Newsreader-Regular.ttf
        # Deep links fra widgetene: finanshub://<side>
        CFBundleURLTypes:
          - CFBundleURLName: no.kristo.finanshub
            CFBundleURLSchemes: [finanshub]

  FinansHubWidgets:
    type: app-extension
    platform: iOS
    sources:
      - FinansHubWidgets/Sources
      - Shared
    entitlements:
      path: FinansHubWidgets/FinansHubWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.no.kristo.finanshub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.kristo.finanshub.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FinansHub
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: FinansHubWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Widgetene henter fra serveren selv, også på lokal adresse (http://192.168…).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
