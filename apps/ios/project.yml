name: FinansHub
options:
  bundleIdPrefix: no.kristo
  deploymentTarget:
    iOS: "17.0"
    # Prompt 34: Kalender for Mac (KalenderMac).
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "4.0"
    CURRENT_PROJECT_VERSION: "4"
    DEVELOPMENT_TEAM: ""
targets:
  FinansHub:
    type: application
    platform: iOS
    sources:
      - FinansHub/Sources
      - FinansHub/Resources
      - Shared
      # Prompt 33: App Group-nøklene som Kalender-appen leser (companion-token).
      - SharedKal/Group
    dependencies:
      # Widgetene (WidgetKit) bygges som utvidelse og legges i FinansHub.app/PlugIns.
      - target: FinansHubWidgets
        embed: true
    entitlements:
      path: FinansHub/FinansHub.entitlements
      properties:
        com.apple.security.application-groups:
          - group.no.kristo.finanshub
        # Familie: helsesammendrag fra Apple Helse (bare det brukeren velger å dele).
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Prompt 20: HKObserverQuery + enableBackgroundDelivery (skritt og puls, hver time) krever denne på iOS 15+.
        com.apple.developer.healthkit.background-delivery: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.kristo.finanshub
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Innstillinger → App-ikon: «Papir-monogram» og «Fire rom» (hver med lys, mørk og tonet variant).
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: "AppIcon-Monogram AppIcon-Rom"
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        INFOPLIST_KEY_CFBundleDisplayName: FinansHub
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSCameraUsageDescription: "Kameraet brukes til å ta bilde av kvitteringer og skanne QR-koder for å logge inn på en ny enhet."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Velg kvitteringsbilder fra biblioteket."
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Face ID brukes til å låse opp FinansHub."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "FinansHub kobler til homelab-serveren din på lokalt nett."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Posisjonen din deles med familien i Familie og kart når du har slått på deling."
        INFOPLIST_KEY_NSLocationAlwaysAndWhenInUseUsageDescription: "Med «Alltid» oppdateres posisjonen din for familien også når appen er lukket, og du får varsler når noen kommer til eller forlater en sone."
        # Prompt 27: mikrofonen i Chat (tale til tekst på norsk).
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Mikrofonen brukes når du snakker til Chat."
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Talen din gjøres om til tekst på norsk i Chat."
        INFOPLIST_KEY_NSMotionUsageDescription: "Aktivitet (går, sykler, kjører) vises for familien sammen med posisjonen din."
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Appen leser skritt, puls, søvn og aktivitet for å vise dem i Familie."
        # Appen skriver ikke til Helse, men teksten må finnes hvis en senere versjon gjør det (ellers krasj ved forespørsel).
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Appen skriver ikke til Apple Health. Den leser bare det du velger å dele i Familie."
    info:
      path: FinansHub/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # «Last ned» lagrer kvitteringer i appens mappe, som vises i Filer → På min iPhone → FinansHub.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # Fontene i Papir og Mat (OFL, Google Fonts): Newsreader, Manrope, IBM Plex Mono, Instrument Serif og Bricolage Grotesque.
        UIAppFonts:
          - BricolageGrotesque-ExtraBold.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
          - InstrumentSerif-Regular.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - Manrope-Medium.ttf
          - Manrope-Regular.ttf
          - Manrope-SemiBold.ttf
          - Newsreader-Italic.ttf
          - Newsreader-Medium.ttf
          - Newsreader-Regular.ttf
        # Familie: posisjon i bakgrunnen og helsesammendrag omtrent hvert 15. minutt.
        UIBackgroundModes: [location, fetch, processing]
        # Prompt 31: no.kristo.finanshub.notify henter /api/notify/pending (Glimt-svar, prøve-varsler) når appen er lukket.
        BGTaskSchedulerPermittedIdentifiers: [no.kristo.finanshub.health, no.kristo.finanshub.family, no.kristo.finanshub.notify]
        # Deep links fra widgetene: finanshub://<side>
        # Prompt 38: homelab://login?c=<sid>.<nonce> – QR-innlogging på ny enhet (QrLogin38.swift).
        CFBundleURLTypes:
          - CFBundleURLName: no.kristo.finanshub
            CFBundleURLSchemes: [finanshub, homelab]
        # Prompt 33: canOpenURL(kalender://) – åpne Kalender-appen når den er installert, ellers Homelabs egen kalender.
        LSApplicationQueriesSchemes: [kalender]

  FinansHubWidgets:
    type: app-extension
    platform: iOS
    sources:
      - FinansHubWidgets/Sources
      - FinansHubWidgets/Resources
      - Shared
    entitlements:
      path: FinansHubWidgets/FinansHubWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.no.kristo.finanshub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.kristo.finanshub.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: FinansHub
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: FinansHubWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        # Widgetene henter fra serveren selv, også på lokal adresse (http://192.168…).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  # Prompt 33: Kalender – egen app (no.kristo.kalender) som deler server, konto og App Group med Homelab-appen.
  Kalender:
    type: application
    platform: iOS
    sources:
      - Kalender/Sources
      - Kalender/Resources
      # Delt med KalenderWidgets (og Group med Homelab-appen). Fonts: Newsreader, Manrope og IBM Plex Mono (kopi av Papir-fontene, OFL).
      - SharedKal/Group
      - SharedKal/Core
      - SharedKal/Fonts
    dependencies:
      - target: KalenderWidgets
        embed: true
    entitlements:
      path: Kalender/Kalender.entitlements
      properties:
        com.apple.security.application-groups:
          - group.no.kristo.finanshub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.kristo.kalender
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Kalender
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Kalender kobler til Homelab-serveren din på lokalt nett."
    info:
      path: Kalender/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - IBMPlexMono-SemiBold.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - Manrope-Medium.ttf
          - Manrope-Regular.ttf
          - Manrope-SemiBold.ttf
          - Newsreader-Medium.ttf
          - Newsreader-Regular.ttf
        # kalender://, kalender://dag/2026-10-21, kalender://hendelse?id=…, kalender://liste, kalender://ny?text=…
        CFBundleURLTypes:
          - CFBundleURLName: no.kristo.kalender
            CFBundleURLSchemes: [kalender]
        # «Logg inn med Homelab-appen» (finanshub://kalender-login).
        LSApplicationQueriesSchemes: [finanshub]

  KalenderWidgets:
    type: app-extension
    platform: iOS
    sources:
      - KalenderWidgets/Sources
      - SharedKal/Group
      - SharedKal/Core
      - SharedKal/Fonts
    entitlements:
      path: KalenderWidgets/KalenderWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.no.kristo.finanshub
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.kristo.kalender.widgets
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Kalender
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
    info:
      path: KalenderWidgets/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIAppFonts:
          - IBMPlexMono-SemiBold.ttf
          - Manrope-Bold.ttf
          - Manrope-ExtraBold.ttf
          - Manrope-Medium.ttf
          - Manrope-Regular.ttf
          - Manrope-SemiBold.ttf
          - Newsreader-Medium.ttf
          - Newsreader-Regular.ttf

  # Prompt 34: Kalender for Mac – egen macOS-app (no.kristo.kalender.mac, Kalender.app) med samme konto og backend som web og iPhone.
  # Gjenbruker SharedKal (modeller, nett, fonter) og den rene tolkeren KalQuick.swift fra iOS-appen. Universal (arm64 + x86_64), macOS 13+.
  # Ingen widgets for macOS ennå (krever App Group med provisjoneringsprofil på macOS) og ingen Sparkle (ny avhengighet).
  KalenderMac:
    type: application
    platform: macOS
    deploymentTarget: "13.0"
    sources:
      - KalenderMac/Sources
      - KalenderMac/Resources
      - SharedKal/Core
      - SharedKal/Group
      # Fontene kopieres til Contents/Resources og lastes via ATSApplicationFontsPath.
      - SharedKal/Fonts
      # Ren Foundation-tolking av «frisør 14.30 25.10» (KalParsed, KalRx, KalQuick) – delt med iOS-appen uten kopi.
      - path: Kalender/Sources/KalQuick.swift
      # Prompt 37: adresse og kart (geokoding + kartvisning) deles med iPhone-appen.
      - path: Kalender/Sources/KalGeo37.swift
    # Prompt 38: hovedvinduet viser web-kalenderen (WKWebView mot <server>/kalender?app=mac).
    dependencies:
      - sdk: WebKit.framework
    entitlements:
      path: KalenderMac/KalenderMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        # Arkiv → Importer .ics …
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: no.kristo.kalender.mac
        PRODUCT_NAME: Kalender
        PRODUCT_MODULE_NAME: KalenderMac
        MACOSX_DEPLOYMENT_TARGET: "13.0"
        ARCHS: "$(ARCHS_STANDARD)"
        GENERATE_INFOPLIST_FILE: YES
        ENABLE_HARDENED_RUNTIME: YES
        COMBINE_HIDPI_IMAGES: YES
        # Lokale bygg uten Apple-konto: «Sign to Run Locally». CI bygger med CODE_SIGNING_ALLOWED=NO og ad hoc-signerer etterpå.
        CODE_SIGN_IDENTITY: "-"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_CFBundleDisplayName: Kalender
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "Torskenes verden · Homelab"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Kalender kobler til Homelab-serveren din på lokalt nett."
      configs:
        Debug:
          ONLY_ACTIVE_ARCH: YES
        Release:
          ONLY_ACTIVE_ARCH: NO
    info:
      path: KalenderMac/Info.plist
      properties:
        # Norske systemmenyer (Arkiv, Rediger, Vis, Vindu, Hjelp, Avslutt Kalender …).
        CFBundleDevelopmentRegion: nb
        CFBundleLocalizations: [nb]
        CFBundleAllowMixedLocalizations: true
        LSMinimumSystemVersion: "13.0"
        ATSApplicationFontsPath: "."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # kalender://dag/2026-10-21, kalender://hendelse?id=…, kalender://liste, kalender://ny?text=…, kalender://glimt?q=…
        CFBundleURLTypes:
          - CFBundleURLName: no.kristo.kalender.mac
            CFBundleURLSchemes: [kalender]
